version: '3.8'
services:
  catalog-service:
    build: .
    container_name: ms-catalog
    ports:
      - "8087:8087"
    environment:
      - SERVER_PORT=8087
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq1:5672,rabbitmq2:5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - red-compartida

networks:
  red-compartida:
    external: true