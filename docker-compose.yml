version: '3.8'

services:
  catalog-service:
    build: .
    container_name: ms-catalog
    ports:
      - "8087:8087"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - red-compartida

networks:
  red-compartida:
    external: true